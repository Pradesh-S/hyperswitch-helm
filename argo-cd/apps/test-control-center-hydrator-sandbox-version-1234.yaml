applicationsets:
  test-control-center-hydrator-sandbox:

    namespace: argocd

    additionalLabels:
      test: source-hydrator
      environment: sandbox

    project: default

    generators:
      - list:
          elements:
            - appName: test-control-center-argo-apps
              github_username: Pradesh-S
              environment: sandbox
              version: "1234"
              namespace: hyperswitch-sandbox
              values_file: infra-configurations/sandbox-values.yaml

    template:
      metadata:
        name: "{{ appName }}"
        labels:
          test: source-hydrator
          environment: "{{ environment }}"

      spec:
        project: default
        sourceHydrator:
          drySource:
            repoURL: git@github.com:{{ github_username }}/hyperswitch-helm.git
            path: charts/incubator/hyperswitch-control-center
            targetRevision: main
            helm:
              releaseName: '{{releaseName}}'
              # Absolute paths (prefixed with /) resolve from the repo root,
              # replacing the $values multi-source pattern (not supported in drySource).
              valueFiles:
                - /infra-configurations/prod-values.yaml
          syncSource:
            # Hydrated manifests are pushed to this branch by the commit-server
            # using the argocd-bitbucket-infra-push-secret (atlantis/bitbucket-creds)
            targetBranch: hydrated-manifests
            path: hydrated-manifests/test-control-center/argoapps
        
        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ namespace }}"

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

        info:
          - name: Environment
            value: "{{ environment }}"
