applicationsets:
  test-control-center-hydrator-sandbox:

    namespace: argocd

    additionalLabels:
      test: source-hydrator
      environment: sandbox

    project: default

    generators:
      - list:
          elements:
            - appName: test-control-center-argo-apps
              github_username: Pradesh-S
              environment: sandbox
              version: "1234"
              namespace: hyperswitch-sandbox
              values_file: infra-configurations/sandbox-values.yaml

    template:
      metadata:
        name: "{{ appName }}"
        labels:
          test: source-hydrator
          environment: "{{ environment }}"

      spec:
        project: default

        sources:
          # Primary source (Helm chart)
          - repoURL: git@github.com:{{ github_username }}/hyperswitch-helm.git
            targetRevision: main
            path: charts/incubator/hyperswitch-control-center
            helm:
              valueFiles:
                - $values/{{ values_file }}

          # Secondary source (values repo reference)
          - repoURL: git@github.com:{{ github_username }}/hyperswitch-helm.git
            targetRevision: main
            ref: values

        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ namespace }}"

        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true

        info:
          - name: Environment
            value: "{{ environment }}"
