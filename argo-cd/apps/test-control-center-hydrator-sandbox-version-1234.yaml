applications:
  test-control-center-hydrator-sandbox-version-1234:

    namespace: argocd

    additionalLabels:
      test: source-hydrator
      environment: sandbox

    project: default

    # Primary source (actual deployed manifests path)
    sources:
      - repoURL: git@github.com:Pradesh-S/hyperswitch-helm.git
        targetRevision: main
        path: charts/incubator/hyperswitch-control-center
        helm:
          valueFiles:
            - $values/infra-configurations/prod-values.yaml

      # Secondary source (values repo reference)
      - repoURL: git@github.com:Pradesh-S/hyperswitch-helm.git
        targetRevision: main
        ref: values

    destination:
      server: https://kubernetes.default.svc
      namespace: hyperswitch-sandbox

    syncPolicy:
      automated:
        prune: true
        selfHeal: true

      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true

    info:
      - name: Environment
        value: sandbox
